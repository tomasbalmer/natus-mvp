<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Natus — Demo</title>
    <meta
      name="description"
      content="Demo del producto del usuario de Natus. Prototipo, no un servicio de salud."
    />

    <!-- This is a demo touching mental-health content. It should not be
         indexed or surfaced in search results. Reinforced by robots.txt. -->
    <meta name="robots" content="noindex, nofollow" />

    <meta name="theme-color" content="#0e0e0e" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!--
      Home-screen icons. Without these the phone falls back to the browser's
      own icon, which is what "add to home screen" produced before.

      Every href is relative, because the site is served from a /natus-mvp/
      subpath today and from a domain root if one is ever attached. An
      absolute path would work in exactly one of those.

      Android reads the manifest. iOS ignores it for the icon and reads
      apple-touch-icon, which is why both are here — and why that PNG has
      square corners: iOS rounds it itself, and rounding a rounded icon
      leaves dark notches.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Natus" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

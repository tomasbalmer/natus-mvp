name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer push finish rather than
# cancelling it — a half-deployed Pages site is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Functions first, and the site waits on them.
  #
  # The order is the safe one. A function deployed ahead of the site that
  # calls it is inert; a site deployed ahead of its functions calls a URL that
  # does not answer, and even though `runOnEdge` now degrades to the fixtures
  # on a 404, degrading is not the same as working — somebody would be reading
  # a curated script while believing they were reading their own.
  #
  # It also means a failed function deploy blocks the site, which is
  # deliberate: shipping a front end whose backend did not update is how the
  # two drift apart without anybody noticing.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned like every other action, and the CLI version is pinned too —
      # a tool that deploys code is exactly the supply-chain surface the
      # release-age gate exists for. 2.114.0 was published 2026-08-12, well
      # past the seven-day gate, and it is the version `db push` below was
      # verified with: it links and pushes on the access token alone, with no
      # database password and no terminal.
      - uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.114.0

      # Migrations before functions, and in the same job so a failed migration
      # stops the functions and the site behind them. The order is not
      # cosmetic: the chat function writes `claude_api_calls.charged`, and
      # `logCall` never throws, so a function deployed ahead of its column
      # logs nothing and the free questions become unlimited. This used to be
      # a `supabase db push` somebody had to remember to run by hand first.
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "No SUPABASE_ACCESS_TOKEN: skipping migrations and functions."
            exit 0
          fi
          ref="${PROJECT_REF:-$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')}"
          if [ -z "$ref" ]; then
            echo "Could not determine the project ref." >&2
            exit 1
          fi
          supabase link --project-ref "$ref"
          supabase db push --yes

      - name: Deploy Edge Functions
        env:
          # Genuinely secret, unlike the two variables the build uses: this
          # token can deploy code to the project.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "No SUPABASE_ACCESS_TOKEN: skipping. The site still deploys,"
            echo "and without functions it runs on the curated fixtures."
            exit 0
          fi
          # The ref is not a secret — it is the subdomain of the URL that
          # already ships in the bundle. Derived when the variable is unset so
          # this needs nothing configured on a project that already works.
          ref="${PROJECT_REF:-$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')}"
          if [ -z "$ref" ]; then
            echo "Could not determine the project ref." >&2
            exit 1
          fi
          supabase functions deploy --project-ref "$ref"

  build:
    needs: functions
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact release tags, not floating majors, and
      # each was checked against the same 7-day release-age gate applied to
      # npm dependencies.
      - uses: actions/checkout@v7.0.1

      # No `version` input: the action reads `packageManager` from
      # package.json, keeping the pnpm version in exactly one place.
      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        # VITE_BASE is set here rather than committed, so attaching a custom
        # domain means changing this one line. At app.natus.world the site
        # is served from the root; the `/natus-mvp/` it had on github.io is
        # gone, and GitHub redirects the old URL to the domain.
        env:
          VITE_BASE: /
          # Repository *variables*, not secrets. Both ship in the bundle by
          # design — the publishable key is a public identifier and is safe
          # only because Row Level Security is on for every table. Filing a
          # public value as a secret would mislead whoever reads this next.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # The door. DECISIONS.md section 13.
          #
          # 'false' opens it, and it is open for the preview: the people trying
          # the tool know each other and the data is invented. Set it to 'true'
          # — or delete the variable, since closed is the default — before the
          # fifty-person pilot, which is when the answers stop being invented.
          VITE_REQUIRE_INVITE: ${{ vars.REQUIRE_INVITE }}
        run: pnpm build

      - name: SPA fallback
        # GitHub Pages has no rewrite rules. Serving index.html as 404.html
        # makes a hard refresh on a client-side route resolve instead of 404.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
